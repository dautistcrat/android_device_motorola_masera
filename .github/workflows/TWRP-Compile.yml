name: TWRP - Build

# Plain TWRP build of the same device tree via the minimal manifest.
# /data decrypt on this base is best-effort; OrangeFox remains the
# decrypt-capable vehicle (see README).

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'TWRP Device Tree'
        required: true
        default: 'https://github.com/dautistcrat/android_device_motorola_masera.git'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'fox_16.0'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/motorola/masera'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'masera'
      RELEASE_TYPE:
        description: 'Specify your Release Type'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug
      RELEASE_NAME:
        description: 'Specify your Release Name'
        required: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/TWRP/twrp-14.1
        cd ${GITHUB_WORKSPACE}/TWRP/twrp-14.1
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-14.1 --depth=1
        repo sync -c --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP/twrp-14.1
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building TWRP
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP/twrp-14.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && mka vendorbootimage

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/TWRP/twrp-14.1

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          TWRP/twrp-14.1/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
        name: ${{ inputs.RELEASE_NAME }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP Recovery Build - ${{ inputs.RELEASE_TYPE }}
          Build: minimal twrp-14.1
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Device Tree Commit:
          [${{ env.SHORT_COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) - ${{ env.COMMIT_TITLE }} (${{ env.COMMIT_DATE }})
